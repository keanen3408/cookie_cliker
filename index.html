<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cookie Clicker</title>
</head>
<body>

    <h1>Cookie Clicker</h1>

    <p>Cookies: <span id="counter">0</span></p>

    <p>Cookies per seconde: <span id="cps">0</span></p>

    <button id="cookie">
     <img src="charlie-cookie.png" alt="Cookie">
    </button>

    <h2>Fabrieken</h2>

    <button id="epstein">
        Epstein fabriek (10 cookies)
    </button>

    <p>Epstein fabrieken: <span id="epstein-count">0</span></p>

    <button id="micheal-jackson">
        Micheal Jackson fabriek (100 cookies)
    </button>

    <p>
        Micheal Jackson fabrieken:
        <span id="micheal-count">0</span>
    </p>

    <h2>Speciale coins</h2>

    <p>
        Speciale coins:
        <span id="special-coins">0</span>
    </p>

    <p>
        Klikken:
        <span id="click-count">0</span>
    </p>

    <h2>Speciale upgrades</h2>

    <button id="special-upgrade">
        Gouden cookie (5 speciale coins)
    </button>

    <p>
        Gouden cookie upgrades:
        <span id="golden-count">0</span>
    </p>

    <button id="special-upgrade-2">
        Super fabriek (10 speciale coins)
    </button>

    <p>
        Super fabriek upgrades:
        <span id="super-count">0</span>
    </p>

    <script src="cookie.js"></script>
</body>
testing
</html>
